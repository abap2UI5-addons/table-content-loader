name: vendor-mirror

# Refreshes the vendored copy (see .github/vendor-mirror.json) from abap-util's
# mirror repositories and opens a pull request with the diff - none when
# nothing changed. .github/scripts/vendor-mirror.mjs clones the mirrors, takes
# the objects this repository uses and renames each one to its name here.

on:
  schedule:
    - cron: '23 6 1 * *'   # monthly
  workflow_dispatch:

concurrency:
  group: vendor-mirror

permissions:
  contents: read

jobs:
  mirror:
    permissions:
      contents: write       # create-pull-request pushes its branch
      pull-requests: write  # and opens the pull request
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - run: node .github/scripts/vendor-mirror.mjs
    - uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
      with:
        title: vendor-mirror-update
        branch: vendor-mirror-update
        commit-message: Refresh the vendored copy from abap-util's mirrors
        body: Automated run of .github/scripts/vendor-mirror.mjs.
